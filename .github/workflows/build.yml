name: Build Windows Portable

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

# 创建 Release 需要写权限；构件上传沿用默认 token 即可
permissions:
  contents: write

# 防止同一 ref 上并发运行，避免 Release 被反复 delete/create 产生竞态
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      # 所有 action 都 pin 到具体 commit SHA：@v4 这类可变 tag 可被上游改指向，
      # 属于构建期供应链入口。升级时请同步更新 SHA 与注释里的版本号。
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # 默认会把具备 contents: write 的 token 写进 .git/config；
          # 而本工作流的构建过程会执行上游源码自带的 MSBuild 目标（dotnet publish），
          # 属于「构建期执行外部代码」的场景，故不保留凭据。
          persist-credentials: false

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      # 构建前断言：上游源码必须 pin 在已审计的 commit。
      # 注意不要把「grep src/ 有没有 GitConfigSslverify」放在这一步——
      # 此时 src/ 还不存在（是 build-portable.cmd 运行时才拉取的），断言会永远通过、形同虚设。
      - name: 安全断言 - 上游 commit 必须 pin 在已审计版本
        shell: bash
        run: |
          if ! grep -q "f5425ec6750463f64f6b01d15d8010e0b53f94c4" build-portable.cmd; then
            echo "::error::build-portable.cmd 未 pin 已审计的上游 commit"
            exit 1
          fi
          echo "上游 commit 已固定：f5425ec6750463f64f6b01d15d8010e0b53f94c4"

      - name: Build portable package
        shell: cmd
        run: build-portable.cmd

      # 构建后断言：此时 src/ 已由 build-portable.cmd 拉取并打过补丁，断言才有意义
      - name: 安全断言 - 源码与产物安全复核
        shell: bash
        run: |
          # 先判文件存在：grep 对不存在的文件返回退出码 2，若直接 if grep 会被当成
          # 「没找到」从而通过 —— 补丁没打上时这道闸门恰好失效，属于假阴性。
          F="src/FastGithub.HttpServer/Certs/CertService.cs"
          if [ ! -f "$F" ]; then
            echo "::error::补丁目标文件不存在，[2d] 补丁未生效：$F"
            exit 1
          fi
          if grep -q "GitConfigSslverify" "$F"; then
            echo "::error::补丁未生效：源码中仍存在 GitConfigSslverify（强制关闭 git 全局证书校验）"
            exit 1
          fi
          echo "  已确认源码中不存在 GitConfigSslverify"

          if [ ! -f "src/FastGithub.UI/MainWindow.xaml.cs" ]; then
            echo "::error::主窗体补丁未生效：MainWindow.xaml.cs 不存在"
            exit 1
          fi
          if grep -q "SC_MINIMIZE" "src/FastGithub.UI/MainWindow.xaml.cs"; then
            echo "::error::主窗体补丁未生效：仍存在最小化/关闭不分的 SC_MINIMIZE 判断"
            exit 1
          fi
          echo "  已确认主窗体补丁生效（最小化与关闭语义已拆开）"

          # [2g] 证书缓存补丁：ServiceCollectionExtensions.cs 必须含 SizeLimit
          F2="src/FastGithub.HttpServer/ServiceCollectionExtensions.cs"
          if [ ! -f "$F2" ]; then
            echo "::error::[2g] 补丁未生效：$F2 不存在（证书缓存无上限）"
            exit 1
          fi
          if ! grep -q "SizeLimit" "$F2"; then
            echo "::error::[2g] 补丁未生效：ServiceCollectionExtensions.cs 不含 SizeLimit"
            exit 1
          fi
          echo "  已确认证书缓存补丁生效（AddMemoryCache 配置了 SizeLimit）"

          # [2h] net10 迁移：Directory.Build.props 必须含 net10.0
          F3="src/Directory.Build.props"
          if [ ! -f "$F3" ]; then
            echo "::error::[2h] 补丁未生效：$F3 不存在（TargetFramework 未迁移）"
            exit 1
          fi
          if ! grep -q "net10.0" "$F3"; then
            echo "::error::[2h] 补丁未生效：Directory.Build.props 仍为 net7.0（已 EOL）"
            exit 1
          fi
          if grep -q "net7.0" "$F3"; then
            echo "::error::[2h] 补丁未生效：Directory.Build.props 仍含 net7.0"
            exit 1
          fi
          echo "  已确认 TargetFramework 已迁移到 net10.0"

          # [2f] NuGet 版本固定：csproj 不应再有浮动 rc* 版本
          F4="src/FastGithub/FastGithub.csproj"
          if [ ! -f "$F4" ]; then
            echo "::error::[2f] 校验失败：$F4 不存在"
            exit 1
          fi
          if grep -q 'rc\*' "$F4"; then
            echo "::error::[2f] 补丁未生效：csproj 仍含浮动预发布版本 rc*"
            exit 1
          fi
          echo "  已确认 NuGet 版本已固定（无 rc* 浮动版本）"

          # [2i] EKU 收窄：CertGenerator.cs 不应在 OidCollection 里含 tlsClientOid
          F5="src/FastGithub.HttpServer/Certs/CertGenerator.cs"
          if [ ! -f "$F5" ]; then
            echo "::error::[2i] 校验失败：$F5 不存在"
            exit 1
          fi
          if grep -q "tlsServerOid, tlsClientOid" "$F5"; then
            echo "::error::[2i] 补丁未生效：CertGenerator.cs 仍含 tlsClientOid（MITM CA 不需要客户端认证 EKU）"
            exit 1
          fi
          echo "  已确认 CA 与叶子证书的 EKU 已收窄（移除 tlsClientOid）"

          # [2j] 域名解析补丁：负缓存 + 下发 IP 数量截断
          F6="src/FastGithub.DomainResolve/DomainResolver.cs"
          if [ ! -f "$F6" ]; then
            echo "::error::[2j] 补丁未生效：$F6 不存在（负缓存与 IP 截断缺失）"
            exit 1
          fi
          if ! grep -q "NEGATIVE_CACHE_MILLISECONDS" "$F6"; then
            echo "::error::[2j] 补丁未生效：DomainResolver.cs 不含负缓存 NEGATIVE_CACHE_MILLISECONDS"
            exit 1
          fi
          if ! grep -q "Take(MAX_IP_COUNT)" "$F6"; then
            echo "::error::[2j] 补丁未生效：DomainResolver.cs 未把下发 IP 截断为 MAX_IP_COUNT"
            exit 1
          fi
          echo "  已确认域名解析补丁生效（全失败负缓存 30s + IP 数量截断）"

          # [2k] 测速周期补丁：1s -> 15s
          F7="src/FastGithub.DomainResolve/DomainResolveHostedService.cs"
          if [ ! -f "$F7" ]; then
            echo "::error::[2k] 补丁未生效：$F7 不存在（测速周期仍为 1 秒）"
            exit 1
          fi
          if grep -q "FromSeconds(1d)" "$F7"; then
            echo "::error::[2k] 补丁未生效：测速周期仍为 1 秒"
            exit 1
          fi
          if ! grep -q "FromSeconds(15d)" "$F7"; then
            echo "::error::[2k] 补丁未生效：测速周期未放宽到 15 秒"
            exit 1
          fi
          echo "  已确认后台测速周期已放宽到 15 秒"

          # [2l] 拨测并发补丁：并发上限 + 整轮串行化
          F8="src/FastGithub.DomainResolve/IPAddressService.cs"
          if [ ! -f "$F8" ]; then
            echo "::error::[2l] 补丁未生效：$F8 不存在（并发拨测无上限）"
            exit 1
          fi
          if ! grep -q "SemaphoreSlim" "$F8"; then
            echo "::error::[2l] 补丁未生效：IPAddressService.cs 不含 SemaphoreSlim 并发闸门"
            exit 1
          fi
          echo "  已确认拨测并发已加上限（SemaphoreSlim）"

          # [2m] 日志容量补丁：单文件大小上限 + 保留数量上限
          F9="src/FastGithub/Startup.cs"
          if [ ! -f "$F9" ]; then
            echo "::error::[2m] 补丁未生效：$F9 不存在（日志文件无容量上限）"
            exit 1
          fi
          if ! grep -q "rollOnFileSizeLimit" "$F9"; then
            echo "::error::[2m] 补丁未生效：Startup.cs 未配置 rollOnFileSizeLimit"
            exit 1
          fi
          if ! grep -q "retainedFileCountLimit" "$F9"; then
            echo "::error::[2m] 补丁未生效：Startup.cs 未配置 retainedFileCountLimit"
            exit 1
          fi
          echo "  已确认日志文件容量与保留数量已限制"

          # [2n] FallbackDns 补丁：不得再含国内不可达的 8.8.8.8
          F10="src/FastGithub/appsettings.json"
          if [ ! -f "$F10" ]; then
            echo "::error::[2n] 补丁未生效：$F10 不存在"
            exit 1
          fi
          if grep -q "8.8.8.8" "$F10"; then
            echo "::error::[2n] 补丁未生效：appsettings.json 仍含国内不可达的 8.8.8.8"
            exit 1
          fi
          if ! grep -q "223.5.5.5" "$F10"; then
            echo "::error::[2n] 补丁未生效：appsettings.json 缺少 223.5.5.5"
            exit 1
          fi
          echo "  已确认 FallbackDns 已移除 8.8.8.8 并补入 223.5.5.5"

          # [2o] 端口占用检测补丁：保留监听的 Address
          F11="src/FastGithub.Configuration/GlobalListener.cs"
          if [ ! -f "$F11" ]; then
            echo "::error::[2o] 补丁未生效：$F11 不存在（回环443仍会被其它网卡IP占用误判）"
            exit 1
          fi
          if ! grep -q "IPAddress.IPv6Loopback" "$F11"; then
            echo "::error::[2o] 补丁未生效：GlobalListener.cs 未按地址过滤监听项"
            exit 1
          fi
          echo "  已确认端口占用检测已保留监听地址"

          # [2p] CA 删除补丁：精确匹配 + 自签名，且不得再用子串匹配
          F12="src/FastGithub.HttpServer/Certs/CaCertInstallers/CaCertInstallerOfWindows.cs"
          if [ ! -f "$F12" ]; then
            echo "::error::[2p] 补丁未生效：$F12 不存在"
            exit 1
          fi
          if ! grep -q "IssuerName.Name" "$F12"; then
            echo "::error::[2p] 补丁未生效：未按自签名条件做精确匹配"
            exit 1
          fi
          if grep -q "FindBySubjectName" "$F12"; then
            echo "::error::[2p] 补丁未生效：仍在使用子串匹配的 FindBySubjectName（会误删第三方根证书）"
            exit 1
          fi
          echo "  已确认 CA 删除已改为精确匹配 + 自签名判定"

          # [2q]/[2aa] 服务镜像路径补丁（H-3 起：黑名单 -> 白名单，判定下沉到 ServiceInstallUtil）
          F13="src/FastGithub/ServiceExtensions.cs"
          if [ ! -f "$F13" ]; then
            echo "::error::[2q] 补丁未生效：$F13 不存在"
            exit 1
          fi
          if ! grep -q "Path.GetFullPath" "$F13"; then
            echo "::error::[2q] 补丁未生效：Windows 分支未使用 Path.GetFullPath"
            exit 1
          fi
          if ! grep -q "IsAllowedServiceBinaryPath" "$F13"; then
            echo "::error::[2q] 补丁未生效：调用侧未委托白名单校验 IsAllowedServiceBinaryPath"
            exit 1
          fi
          if grep -q "UserProfile" "$F13"; then
            echo "::error::[2q] 补丁未生效：仍残留黑名单（UserProfile）逻辑，未改为白名单"
            exit 1
          fi
          echo "  已确认服务镜像路径已规范化并改走白名单校验（黑名单已移除）"

          # [2r] TLS 白名单补丁
          F14="src/FastGithub.HttpServer/KestrelServerExtensions.cs"
          if [ ! -f "$F14" ]; then
            echo "::error::[2r] 补丁未生效：$F14 不存在"
            exit 1
          fi
          if ! grep -q "IsMatch" "$F14"; then
            echo "::error::[2r] 补丁未生效：TLS 层未做域名白名单校验"
            exit 1
          fi
          if ! grep -q "IPAddress.TryParse" "$F14"; then
            echo "::error::[2r] 补丁未生效：未放行 IP 字面量/无点主机名（会打断 localhost 直连）"
            exit 1
          fi
          echo "  已确认 TLS 层已按白名单校验 SNI（并放行本机地址直连）"

          # [2s] WinDivert 文件自愈补丁
          F15="src/FastGithub/Program.cs"
          if [ ! -f "$F15" ]; then
            echo "::error::[2s] 补丁未生效：$F15 不存在"
            exit 1
          fi
          if ! grep -q "C1E060EE19444A259B2162F8AF0F3FE8C4428A1C6F694DCE20DE194AC8D7D9A2" "$F15"; then
            echo "::error::[2s] 补丁未生效：缺少 WinDivert.dll 的 SHA256 基线"
            exit 1
          fi
          echo "  已确认 WinDivert 驱动文件已加入哈希自愈校验"

          # [2m] 热重载必须关闭（程序可能解压在用户可写目录）
          F16="src/FastGithub/Startup.cs"
          if [ ! -f "$F16" ]; then
            echo "::error::[2m] 补丁未生效：$F16 不存在"
            exit 1
          fi
          if ! grep -q "AddJsonFile(jsonFile, true, false)" "$F16"; then
            echo "::error::[2m] 补丁未生效：appsettings 仍开启 reloadOnChange 热重载"
            exit 1
          fi
          echo "  已确认 appsettings 热重载已关闭"

          # [2t] ProxyOverride 回滚补丁
          F17="src/FastGithub.PacketIntercept/Dns/ProxyConflictSolver.cs"
          if [ ! -f "$F17" ]; then
            echo "::error::[2t] 补丁未生效：$F17 不存在"
            exit 1
          fi
          if ! grep -q "PROXYOVERRIDE_OWNED_KEY" "$F17"; then
            echo "::error::[2t] 补丁未生效：没有自己的条目记录键，取消勾选仍会残留"
            exit 1
          fi
          if ! grep -q "DeleteOwnedProxyOvride" "$F17"; then
            echo "::error::[2t] 补丁未生效：恢复时未清空自己的条目记录"
            exit 1
          fi
          if grep -q "\.Except(" "$F17"; then
            echo "::error::[2t] 补丁未生效：仍在用 Except(DomainConfigs.Keys) 做移除（取消勾选会残留）"
            exit 1
          fi
          echo "  已确认 ProxyOverride 已改为按自己的记录精确回滚"

          # [2u] 流量图可见性门控
          F18="src/FastGithub.UI/FlowChart.xaml.cs"
          if [ ! -f "$F18" ]; then
            echo "::error::[2u] 补丁未生效：$F18 不存在"
            exit 1
          fi
          if ! grep -q "IsVisible" "$F18"; then
            echo "::error::[2u] 补丁未生效：流量图未按可见性门控（不可见仍在轮询）"
            exit 1
          fi
          echo "  已确认流量图已按可见性门控"

          # [2v] 请求日志降噪
          F19="src/FastGithub.HttpServer/HttpMiddlewares/RequestLoggingMilldeware.cs"
          if [ ! -f "$F19" ]; then
            echo "::error::[2v] 补丁未生效：$F19 不存在"
            exit 1
          fi
          if ! grep -q "LogDebug" "$F19"; then
            echo "::error::[2v] 补丁未生效：错误路径未把完整堆栈降级到 Debug"
            exit 1
          fi
          echo "  已确认请求日志错误路径已降噪（完整堆栈降级 Debug）"

          # [2w] GitHub collector 204 片段
          F20="src/FastGithub/appsettings/appsettings.github.json"
          if [ ! -f "$F20" ]; then
            echo "::error::[2w] 补丁未生效：$F20 不存在"
            exit 1
          fi
          if ! grep -q "collector.github.com" "$F20"; then
            echo "::error::[2w] 补丁未生效：appsettings.github.json 缺少 collector.github.com"
            exit 1
          fi
          if ! grep -q '"StatusCode": 204' "$F20"; then
            echo "::error::[2w] 补丁未生效：collector.github.com 未配置 StatusCode 204 响应"
            exit 1
          fi
          echo "  已确认 GitHub collector 片段已生效（collector.github.com -> 204）"

          # [2c] IE 版本改读注册表
          F21="src/FastGithub.UI/Program.cs"
          if [ ! -f "$F21" ]; then
            echo "::error::[2c] 补丁未生效：$F21 不存在"
            exit 1
          fi
          if ! grep -q "svcVersion" "$F21"; then
            echo "::error::[2c] 补丁未生效：IE 版本未改读注册表 svcVersion"
            exit 1
          fi
          echo "  已确认 IE 版本改由注册表读取（不再实例化 WebBrowser 控件）"

          # [2c] 背景图按显示尺寸解码
          F22="src/FastGithub.UI/AcceleratorPanel.xaml.cs"
          if [ ! -f "$F22" ]; then
            echo "::error::[2c] 补丁未生效：$F22 不存在"
            exit 1
          fi
          if ! grep -q "DecodePixelWidth" "$F22"; then
            echo "::error::[2c] 补丁未生效：背景图未设置 DecodePixelWidth（按原图全分辨率解码）"
            exit 1
          fi
          echo "  已确认背景图已按显示尺寸解码"

          # [2j] 过滤链路本地地址
          F23="src/FastGithub.DomainResolve/DomainResolver.cs"
          if [ ! -f "$F23" ]; then
            echo "::error::[2j] 补丁未生效：$F23 不存在"
            exit 1
          fi
          if ! grep -q "169.254" "$F23"; then
            echo "::error::[2j] 补丁未生效：未过滤 IPv4 链路本地 169.254.0.0/16"
            exit 1
          fi
          echo "  已确认已过滤链路本地地址（169.254.0.0/16 与 fe80::/10）"

          # [2x] TomlUtil 原子写
          F24="src/FastGithub.DomainResolve/TomlUtil.cs"
          if [ ! -f "$F24" ]; then
            echo "::error::[2x] 补丁未生效：$F24 不存在"
            exit 1
          fi
          if ! grep -q "File.Move" "$F24"; then
            echo "::error::[2x] 补丁未生效：TomlUtil 未使用原子替换写文件"
            exit 1
          fi
          echo "  已确认 TomlUtil 已改为原子写（临时文件 + File.Move）"

          # [2y] hosts 纯字节处理 + 原子替换 + 崩溃自愈（HostsConflictSolver）
          F25="src/FastGithub.PacketIntercept/Dns/HostsConflictSolver.cs"
          if [ ! -f "$F25" ]; then
            echo "::error::[2y] 补丁未生效：$F25 不存在"
            exit 1
          fi
          if ! grep -q "File.ReadAllBytes" "$F25"; then
            echo "::error::[2y] 补丁未生效：未按字节读取 hosts（File.ReadAllBytes）"
            exit 1
          fi
          if ! grep -q "Registry.LocalMachine" "$F25"; then
            echo "::error::[2y] 补丁未生效：回滚记录未写入 HKLM（Registry.LocalMachine）"
            exit 1
          fi
          if ! grep -q "File.Replace" "$F25"; then
            echo "::error::[2y] 补丁未生效：hosts 未使用 File.Replace 原子替换写文件"
            exit 1
          fi
          echo "  已确认 hosts 纯字节处理 + 原子替换 + 崩溃自愈记录已生效"

          # [2z] dnscrypt 路径绝对化 + Job Object（DnscryptProxy）
          F26="src/FastGithub.DomainResolve/DnscryptProxy.cs"
          if [ ! -f "$F26" ]; then
            echo "::error::[2z] 补丁未生效：$F26 不存在"
            exit 1
          fi
          if ! grep -q "Environment.ProcessPath" "$F26"; then
            echo "::error::[2z] 补丁未生效：dnscrypt 路径未绝对化（无 Environment.ProcessPath）"
            exit 1
          fi
          if ! grep -q "AssignProcessToJobObject" "$F26"; then
            echo "::error::[2z] 补丁未生效：未把 dnscrypt-proxy 纳入 Job Object"
            exit 1
          fi
          echo "  已确认 dnscrypt 路径绝对化 + Job Object 兜底已生效"

          # [2aa] 服务安装目录白名单（ServiceInstallUtil）
          F27="src/FastGithub.DomainResolve/ServiceInstallUtil.cs"
          if [ ! -f "$F27" ]; then
            echo "::error::[2aa] 补丁未生效：$F27 不存在"
            exit 1
          fi
          if ! grep -q "ProgramFiles" "$F27"; then
            echo "::error::[2aa] 补丁未生效：白名单未使用 ProgramFiles/ProgramFilesX86"
            exit 1
          fi
          if ! grep -q "IsNullOrEmpty" "$F27"; then
            echo "::error::[2aa] 补丁未生效：未对白名单候选防空串（StartsWith 空串恒真陷阱）"
            exit 1
          fi
          echo "  已确认服务安装目录已改为白名单校验（防空串陷阱）"

          # [2c] UI 强杀兜底改为杀进程树（J-2）
          F28="src/FastGithub.UI/Program.cs"
          if [ ! -f "$F28" ]; then
            echo "::error::[2c] 补丁未生效：$F28 不存在"
            exit 1
          fi
          if ! grep -q "Environment.SystemDirectory" "$F28"; then
            echo "::error::[2c] 补丁未生效：强杀兜底未用系统目录定位 taskkill.exe"
            exit 1
          fi
          if ! grep -q "taskkill.exe" "$F28"; then
            echo "::error::[2c] 补丁未生效：强杀兜底未改为 taskkill 进程树强杀"
            exit 1
          fi
          echo "  已确认 UI 强杀兜底已改为 taskkill /F /T 进程树强杀"

          # [2ab] TLS 入侵中间件裸 catch 记日志（TlsInvadeMiddleware）
          F29="src/FastGithub.HttpServer/TlsMiddlewares/TlsInvadeMiddleware.cs"
          if [ ! -f "$F29" ]; then
            echo "::error::[2ab] 补丁未生效：$F29 不存在"
            exit 1
          fi
          if ! grep -q "LogDebug" "$F29"; then
            echo "::error::[2ab] 补丁未生效：裸 catch 未改为记 Debug"
            exit 1
          fi
          echo "  已确认 TLS 入侵中间件异常已记 Debug（不再裸 catch 静默吞掉）"

          # [2ac] Yarp.ReverseProxy 高危依赖已升级（GHSA-jrjw-qgr2-wfcg / CVE-2023-33141）
          F30="src/FastGithub.HttpServer/FastGithub.HttpServer.csproj"
          if [ ! -f "$F30" ]; then
            echo "::error::[2ac] 补丁未生效：$F30 不存在"
            exit 1
          fi
          if ! grep -q 'Include="Yarp.ReverseProxy" Version="1.1.2"' "$F30"; then
            echo "::error::[2ac] 补丁未生效：Yarp.ReverseProxy 未升到已修复的 1.1.2（GHSA-jrjw-qgr2-wfcg）"
            exit 1
          fi
          if grep -q 'Include="Yarp.ReverseProxy" Version="1.1.1"' "$F30"; then
            echo "::error::[2ac] 补丁未生效：Yarp.ReverseProxy 仍为受影响的 1.1.1"
            exit 1
          fi
          echo "  已确认 Yarp.ReverseProxy 已升到 1.1.2（修复 GHSA-jrjw-qgr2-wfcg）"

          # [2ad] Microsoft.Extensions.Caching.Memory 高危依赖已升级（GHSA-qj66-m88j-hmgj / CVE-2024-43483）
          F31="src/FastGithub.DomainResolve/FastGithub.DomainResolve.csproj"
          if [ ! -f "$F31" ]; then
            echo "::error::[2ad] 补丁未生效：$F31 不存在"
            exit 1
          fi
          if ! grep -q 'Include="Microsoft.Extensions.Caching.Memory" Version="10.0.12"' "$F31"; then
            echo "::error::[2ad] 补丁未生效：Caching.Memory 未升到已修复的 10.0.12（GHSA-qj66-m88j-hmgj）"
            exit 1
          fi
          if grep -q 'Include="Microsoft.Extensions.Caching.Memory" Version="6.0.1"' "$F31"; then
            echo "::error::[2ad] 补丁未生效：Caching.Memory 仍为受影响的 6.0.1"
            exit 1
          fi
          echo "  已确认 Microsoft.Extensions.Caching.Memory 已升到 10.0.12（修复 GHSA-qj66-m88j-hmgj）"

          # [P0] 防配置绑定静默丢值：配置绑定源生成器（net10+PublishTrimmed 默认启用）不支持 record 的
          #      init-only 属性，会静默跳过赋值（键在、值全丢）；已禁用生成器回退反射绑定，
          #      [DynamicDependency] 与 TrimmerRootAssembly 是反射绑定路径下保留成员的兜底。
          F32="src/FastGithub/Startup.cs"
          if [ ! -f "$F32" ]; then
            echo "::error::[2m] 补丁未生效：$F32 不存在"
            exit 1
          fi
          if ! grep -q "typeof(DomainConfig)" "$F32"; then
            echo "::error::[P0] Startup.cs 未标注 typeof(DomainConfig)，反射绑定路径将失去成员保留兜底导致值绑定静默失效"
            exit 1
          fi
          if ! grep -q "typeof(ResponseConfig)" "$F32"; then
            echo "::error::[P0] Startup.cs 未标注 typeof(ResponseConfig)，反射绑定路径将失去成员保留兜底导致 Response 绑定静默失效"
            exit 1
          fi
          if ! grep -q "typeof(FastGithubOptions)" "$F32"; then
            echo "::error::[P0] Startup.cs 未标注 typeof(FastGithubOptions)"
            exit 1
          fi
          if ! grep -q "CheckConfigurationBinding" "$F32"; then
            echo "::error::[P0] Startup.cs 缺少配置绑定自检 CheckConfigurationBinding（静默失效将不可观测）"
            exit 1
          fi
          echo "  已确认 Startup.cs 已对配置类型做 [DynamicDependency] 标注并含绑定自检"

          # [P0] 防 trimming：把配置程序集整体 root
          F33="src/Directory.Build.props"
          if [ ! -f "$F33" ]; then
            echo "::error::[2h] 补丁未生效：$F33 不存在"
            exit 1
          fi
          if ! grep -q 'TrimmerRootAssembly Include="FastGithub.Configuration"' "$F33"; then
            echo "::error::[P0] Directory.Build.props 未 root FastGithub.Configuration 程序集（反射绑定路径需要这些成员，配置绑定源生成器已禁用）"
            exit 1
          fi
          echo "  已确认 Directory.Build.props 已 TrimmerRootAssembly FastGithub.Configuration"

          # [P0] 防 trimming：DomainConfigs 属性显式标注 DynamicallyAccessedMembers
          F34="src/FastGithub.Configuration/FastGithubOptions.cs"
          if [ ! -f "$F34" ]; then
            echo "::error::[2ae] 补丁未生效：$F34 不存在"
            exit 1
          fi
          if ! grep -q "DynamicallyAccessedMembers" "$F34"; then
            echo "::error::[P0] FastGithubOptions.DomainConfigs 未标注 [DynamicallyAccessedMembers]"
            exit 1
          fi
          echo "  已确认 FastGithubOptions.DomainConfigs 已标注 [DynamicallyAccessedMembers]"

          # [P0] 启动期绑定自检已接入 Program.cs
          F35="src/FastGithub/Program.cs"
          if [ ! -f "$F35" ]; then
            echo "::error::[2s] 补丁未生效：$F35 不存在"
            exit 1
          fi
          if ! grep -q "CheckConfigurationBinding" "$F35"; then
            echo "::error::[P0] Program.cs 未调用 CheckConfigurationBinding，启动期绑定自检未生效"
            exit 1
          fi
          echo "  已确认 Program.cs 已在启动期调用配置绑定自检"

          # [2j] DomainResolver：地址列表比较改为顺序无关（消除 DNS 轮转造成的伪变更与日志噪声）
          F36="src/FastGithub.DomainResolve/DomainResolver.cs"
          if [ ! -f "$F36" ]; then
            echo "::error::[2j] 补丁未生效：$F36 不存在"
            exit 1
          fi
          if ! grep -q "IsSameAddressSet" "$F36"; then
            echo "::error::[2j] 补丁未生效：DomainResolver 未改用顺序无关的地址比较（IsSameAddressSet）"
            exit 1
          fi
          if grep -q "oldSegmentums.SequenceEqual(newSegmentums)" "$F36"; then
            echo "::error::[2j] 补丁未生效：仍在用顺序敏感的 SequenceEqual 比较地址列表"
            exit 1
          fi
          echo "  已确认 DomainResolver 的地址列表比较已改为顺序无关"

          # [2u] FlowChart：HttpClient 提升为类级 static（不再随方法退出 Dispose，全进程复用）
          F37="src/FastGithub.UI/FlowChart.xaml.cs"
          if [ ! -f "$F37" ]; then
            echo "::error::[2u] 补丁未生效：$F37 不存在"
            exit 1
          fi
          if ! grep -q "private static readonly HttpClient httpClient" "$F37"; then
            echo "::error::[2u] 补丁未生效：FlowChart 未使用类级 static HttpClient"
            exit 1
          fi
          if grep -q "using var httpClient = new HttpClient();" "$F37"; then
            echo "::error::[2u] 补丁未生效：FlowChart 仍在方法体内新建 HttpClient"
            exit 1
          fi
          if ! grep -q "this.IsVisible == false" "$F37"; then
            echo "::error::[2u] 补丁未生效：FlowChart 可见性门控丢失（会退化为每秒轮询 /flowStatistics）"
            exit 1
          fi
          echo "  已确认 FlowChart 使用类级 static HttpClient 且保留可见性门控"

          F38="src/FastGithub.HttpServer/Certs/CertService.cs"
          if [ ! -f "$F38" ]; then
            echo "::error::[2d] 补丁未生效：$F38 不存在"
            exit 1
          fi
          if ! grep -q "WorkingDirectory = Environment.SystemDirectory" "$F38"; then
            echo "::error::[2d] 补丁未生效：git 调用未设置 WorkingDirectory=SystemDirectory（程序目录可投放 git.exe 劫持管理员进程）"
            exit 1
          fi
          echo "  已确认 git 调用设置 WorkingDirectory=SystemDirectory 防程序目录劫持"

          F39="src/FastGithub.UI/AcceleratorPanel.xaml.cs"
          if [ ! -f "$F39" ]; then
            echo "::error::[2c] 补丁未生效：$F39 不存在"
            exit 1
          fi
          if ! grep -q "GetFullPath(BackgroundDir)" "$F39"; then
            echo "::error::[2c] 补丁未生效：背景图加载未校验路径必须位于 ui-background/ 目录内（可加载任意文件）"
            exit 1
          fi
          echo "  已确认背景图加载限定在 ui-background/ 目录内"

          F40="src/FastGithub.UI/Program.cs"
          if [ ! -f "$F40" ]; then
            echo "::error::[2c] 补丁未生效：$F40 不存在"
            exit 1
          fi
          if ! grep -q "DispatcherUnhandledException" "$F40"; then
            echo "::error::[2c] 补丁未生效：UI 未处理异常崩溃时未兜底停引擎（引擎+锚点会残留）"
            exit 1
          fi
          echo "  已确认 UI 崩溃兜底停引擎"

          F41="src/Directory.Build.props"
          if [ ! -f "$F41" ]; then
            echo "::error::[2h] 补丁未生效：$F41 不存在"
            exit 1
          fi
          if ! grep -q '<EnableConfigurationBindingGenerator>false</EnableConfigurationBindingGenerator>' "$F41"; then
            echo "::error::[P0] Directory.Build.props 未禁用配置绑定源生成器（record init-only 属性会被静默跳过绑定）"
            exit 1
          fi
          if ! grep -q 'TrimmerRootAssembly Include="fastgithub"' "$F41"; then
            echo "::error::[P0] Directory.Build.props 未 root fastgithub 主程序集（AppOptions 反射绑定成员可能被裁）"
            exit 1
          fi
          echo "  已确认配置绑定源生成器已禁用且 fastgithub 程序集已 root（反射绑定恢复）"

          # [P0] dnscrypt 源去自指：源列表里的自引用项会被自身投毒进 127.0.0.1，形成拉源死锁
          F42="dist/fastgithub_win-x64/dnscrypt-proxy/dnscrypt-proxy.toml"
          if [ ! -f "$F42" ]; then
            echo "::error::[5i] 补丁未生效：$F42 不存在"
            exit 1
          fi
          if grep -q 'raw.githubusercontent.com' "$F42"; then
            echo "::error::[P0] dnscrypt 源仍含自引用项（会被自身投毒进 127.0.0.1，拉源请求必然超时）"
            exit 1
          fi
          if grep -qE "sources\.['\"]?relays" "$F42"; then
            echo "::error::[P0] dnscrypt 仍保留无用的 relays 源段（anonymized DNS 未启用，只会触发注定失败的拉取）"
            exit 1
          fi
          if ! grep -q 'download.dnscrypt.info' "$F42"; then
            echo "::error::[P0] dnscrypt 可用镜像源丢失（public-resolvers 将无法刷新）"
            exit 1
          fi
          echo "  已确认 dnscrypt 源已去自指且未使用的 relays 源段已删除"

          # [P0] 候选 IP 按 IPv4 优先重排：否则 AAAA 会占满截断配额，IPv4 永不生效
          F43="src/FastGithub.DomainResolve/DomainResolver.cs"
          if [ ! -f "$F43" ]; then
            echo "::error::[5i] 补丁未生效：$F43 不存在"
            exit 1
          fi
          if ! grep -q 'AddressFamily.InterNetwork ? 0 : 1' "$F43"; then
            echo "::error::[P0] DomainResolver 未做 IPv4 优先重排（AAAA 会占满截断配额，IPv4 永不生效）"
            exit 1
          fi
          if ! grep -q 'OrderIPv4First' "$F43"; then
            echo "::error::[P0] DomainResolver 缺少 IPv4 优先重排方法"
            exit 1
          fi
          echo "  已确认 DomainResolver 已按 IPv4 优先重排（IPv6 仍保留为后备）"

          # [P1] Release 条件的引号必须两侧都有，否则条件恒为 false、Release 下调试符号设置不生效
          F44="src/Directory.Build.props"
          if [ ! -f "$F44" ]; then
            echo "::error::[P1] 补丁未生效：$F44 不存在"
            exit 1
          fi
          if ! grep -qF "Condition=\"'\$(Configuration)'=='Release'\"" "$F44"; then
            echo "::error::[P1] Directory.Build.props 的 Release 条件缺少单引号（条件恒 false，Release 下 DebugType/DebugSymbols 不生效，构建中间产物会带调试符号）"
            exit 1
          fi
          echo "  已确认 Release 条件带引号（Release 下不再产出调试符号）"

          if [ ! -d dist ]; then
            echo "::error::dist 目录不存在，构建产物缺失"
            exit 1
          fi
          if find dist -name "*.key" -print -quit | grep -q .; then
            echo "::error::发布包中检出私钥文件（*.key），构建终止"
            exit 1
          fi
          echo "  已确认发布包中无私钥文件（*.key）"

          if [ -d dist/fastgithub_win-x64/cacert ]; then
            echo "::error::发布包中检出预置 cacert 目录，构建终止"
            exit 1
          fi
          echo "  已确认发布包中无预置 CA 目录"

          F45="dist/fastgithub_win-x64"
          if [ ! -d "$F45" ]; then
            echo "::error::[P1] 发布目录不存在：$F45"
            exit 1
          fi
          if [ -n "$(find "$F45" -name '*.pdb' -print -quit)" ]; then
            echo "::error::[P1] 发布包中检出调试符号文件（*.pdb），Release 条件未生效"
            exit 1
          fi
          echo "  已确认发布包中无调试符号文件（*.pdb）"

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FastGithub-Portable-win-x64
          path: dist/FastGithub-Portable-win-x64.zip
          if-no-files-found: error
          retention-days: 7

      # 只有推送 v* tag 才发版。原先每次 push main（包括纯文档提交）都会自动建 Release，
      # 公开仓库里堆出一串同质版本，用户无法分辨哪个才是可信版本。
      - name: Publish Release (仅 tag 触发)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          TITLE="GitHub+HuggingFace 加速工具 ${TAG}"

          # 产物 SHA256 写进 Release notes，用户下载后可自行校验
          SHA256="$(cat dist/SHA256.txt 2>/dev/null || echo '(未生成)')"
          NOTES="Windows 免安装包（自动构建）。
          解压后以管理员身份运行 FastGithub.UI.exe，首次运行信任本地 CA。
          卸载：以管理员身份运行包内 clean.cmd（移除本机 CA、恢复 git 配置、删除私钥）。
          校验：FastGithub-Portable-win-x64.zip 的 SHA256 = ${SHA256}"

          # 幂等：重推同一 tag 重跑时不因 release 已存在而失败（不加 --cleanup-tag，避免删掉触发本次构建的 tag）
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "  已存在 release ${TAG}，先删除再重建"
            gh release delete "${TAG}" -y
          fi
          gh release create "${TAG}" \
            dist/FastGithub-Portable-win-x64.zip \
            --title "${TITLE}" \
            --notes "${NOTES}"
