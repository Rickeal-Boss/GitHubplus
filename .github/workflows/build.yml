name: Build Windows Portable

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

# 创建 Release 需要写权限；构件上传沿用默认 token 即可
permissions:
  contents: write

# 防止同一 ref 上并发运行，避免 Release 被反复 delete/create 产生竞态
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      # 所有 action 都 pin 到具体 commit SHA：@v4 这类可变 tag 可被上游改指向，
      # 属于构建期供应链入口。升级时请同步更新 SHA 与注释里的版本号。
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # 默认会把具备 contents: write 的 token 写进 .git/config；
          # 而本工作流的构建过程会执行上游源码自带的 MSBuild 目标（dotnet publish），
          # 属于「构建期执行外部代码」的场景，故不保留凭据。
          persist-credentials: false

      - name: Setup .NET 7 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '7.0.x'

      # 构建前断言：上游源码必须 pin 在已审计的 commit。
      # 注意不要把「grep src/ 有没有 GitConfigSslverify」放在这一步——
      # 此时 src/ 还不存在（是 build-portable.cmd 运行时才拉取的），断言会永远通过、形同虚设。
      - name: 安全断言 - 上游 commit 必须 pin 在已审计版本
        shell: bash
        run: |
          if ! grep -q "f5425ec6750463f64f6b01d15d8010e0b53f94c4" build-portable.cmd; then
            echo "::error::build-portable.cmd 未 pin 已审计的上游 commit"
            exit 1
          fi
          echo "上游 commit 已固定：f5425ec6750463f64f6b01d15d8010e0b53f94c4"

      - name: Build portable package
        shell: cmd
        run: build-portable.cmd

      # 构建后断言：此时 src/ 已由 build-portable.cmd 拉取并打过补丁，断言才有意义
      - name: 安全断言 - 源码与产物安全复核
        shell: bash
        run: |
          # 先判文件存在：grep 对不存在的文件返回退出码 2，若直接 if grep 会被当成
          # 「没找到」从而通过 —— 补丁没打上时这道闸门恰好失效，属于假阴性。
          F="src/FastGithub.HttpServer/Certs/CertService.cs"
          if [ ! -f "$F" ]; then
            echo "::error::补丁目标文件不存在，[2d] 补丁未生效：$F"
            exit 1
          fi
          if grep -q "GitConfigSslverify" "$F"; then
            echo "::error::补丁未生效：源码中仍存在 GitConfigSslverify（强制关闭 git 全局证书校验）"
            exit 1
          fi
          echo "  已确认源码中不存在 GitConfigSslverify"

          if [ ! -f "src/FastGithub.UI/MainWindow.xaml.cs" ]; then
            echo "::error::主窗体补丁未生效：MainWindow.xaml.cs 不存在"
            exit 1
          fi
          if grep -q "SC_MINIMIZE" "src/FastGithub.UI/MainWindow.xaml.cs"; then
            echo "::error::主窗体补丁未生效：仍存在最小化/关闭不分的 SC_MINIMIZE 判断"
            exit 1
          fi
          echo "  已确认主窗体补丁生效（最小化与关闭语义已拆开）"

          if [ ! -d dist ]; then
            echo "::error::dist 目录不存在，构建产物缺失"
            exit 1
          fi
          if find dist -name "*.key" -print -quit | grep -q .; then
            echo "::error::发布包中检出私钥文件（*.key），构建终止"
            exit 1
          fi
          echo "  已确认发布包中无私钥文件（*.key）"

          if [ -d dist/fastgithub_win-x64/cacert ]; then
            echo "::error::发布包中检出预置 cacert 目录，构建终止"
            exit 1
          fi
          echo "  已确认发布包中无预置 CA 目录"

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FastGithub-Portable-win-x64
          path: dist/FastGithub-Portable-win-x64.zip
          if-no-files-found: error
          retention-days: 7

      # 只有推送 v* tag 才发版。原先每次 push main（包括纯文档提交）都会自动建 Release，
      # 公开仓库里堆出一串同质版本，用户无法分辨哪个才是可信版本。
      - name: Publish Release (仅 tag 触发)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          TITLE="GitHub+HuggingFace 加速工具 ${TAG}"

          # 产物 SHA256 写进 Release notes，用户下载后可自行校验
          SHA256="$(cat dist/SHA256.txt 2>/dev/null || echo '(未生成)')"
          NOTES="Windows 免安装包（自动构建）。
          解压后以管理员身份运行 FastGithub.UI.exe，首次运行信任本地 CA。
          卸载：以管理员身份运行包内 clean.cmd（移除本机 CA、恢复 git 配置、删除私钥）。
          校验：FastGithub-Portable-win-x64.zip 的 SHA256 = ${SHA256}"

          # 幂等：重推同一 tag 重跑时不因 release 已存在而失败（不加 --cleanup-tag，避免删掉触发本次构建的 tag）
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "  已存在 release ${TAG}，先删除再重建"
            gh release delete "${TAG}" -y
          fi
          gh release create "${TAG}" \
            dist/FastGithub-Portable-win-x64.zip \
            --title "${TITLE}" \
            --notes "${NOTES}"
