name: Build Windows Portable

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

# 创建 Release 需要写权限；构件上传沿用默认 token 即可
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 7 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'

      - name: Build portable package
        shell: cmd
        run: build-portable.cmd

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FastGithub-Portable-win-x64
          path: dist/FastGithub-Portable-win-x64.zip
          if-no-files-found: error

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/FastGithub-Portable-win-x64.zip \
            --title "GitHub+HuggingFace 加速工具 ${GITHUB_REF_NAME}" \
            --notes "Windows 免安装包（解压后以管理员身份运行 FastGithub.UI.exe；首次运行需信任本地 CA）"
