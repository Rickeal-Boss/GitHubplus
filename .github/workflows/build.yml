            echo "::error::[P1] Directory.Build.props 缺少 IncludeSourceRevisionInInformationalVersion（本组首条断言对上游恒真，需靠此串提供判别力）"
            exit 1
          fi
          echo "  已确认本组断言具备判别力（首条对上游恒真，由补丁独有属性兜住）"

          # [P1] 父进程监控：锚点已死（ArgumentException）是预期分支，不得记 Error 污染日志
          F46="src/FastGithub/AppHostedService.cs"
          if [ ! -f "$F46" ]; then
            echo "::error::[2az] 补丁未生效：$F46 不存在"
            exit 1
          fi
          if ! grep -q "catch (ArgumentException)" "$F46"; then
            echo "::error::[P1] AppHostedService 未单独捕获 ArgumentException（UI 快速重启时锚点已死会被误记为 Error）"
            exit 1
          fi
          if ! grep -q "using var parent" "$F46"; then
            echo "::error::[P1] AppHostedService 未用 using 释放 GetProcessById 返回的句柄"
            exit 1
          fi
          echo "  已确认父进程监控的预期异常已降级（ArgumentException -> Information）"

          # [P2] git 缺失降噪：无 git 时跳过配置而非告警「写入失败」
          F47="src/FastGithub.HttpServer/Certs/CertService.cs"
          if [ ! -f "$F47" ]; then
            echo "::error::[2d] 补丁未生效：$F47 不存在"
            exit 1
          fi
          if ! grep -q "IsGitAvailable" "$F47"; then
            echo "::error::[P2] CertService 缺少 git 存在性探测（无 git 用户每次启动收到误导性 WRN）"
            exit 1
          fi
          echo "  已确认 git 缺失时跳过配置（不再误告警）"

          # [P3] 版本号 3.1.3：产品版本号（引擎启动横幅与 UI 标题同源）
          F48="src/Directory.Build.props"
          if [ ! -f "$F48" ]; then
            echo "::error::[P3] 补丁未生效：$F48 不存在"
            exit 1
          fi
          if ! grep -q "<Version>3.1.3</Version>" "$F48"; then
            echo "::error::[P3] Directory.Build.props 版本号未升到 3.1.3"
            exit 1
          fi
          if grep -q "2.1.5" "$F48"; then
            echo "::error::[P3] Directory.Build.props 仍残留旧版本号 2.1.5"
            exit 1
          fi
          echo "  已确认产品版本号已升到 3.1.3"

          # [P3] 客户端主动中断降噪：不再记告警（IsError 已判为非错误）
          F49="src/FastGithub.HttpServer/HttpMiddlewares/RequestLoggingMilldeware.cs"
          if [ ! -f "$F49" ]; then
            echo "::error::[2v] 补丁未生效：$F49 不存在"
            exit 1
          fi
          if ! grep -q "LogDebug" "$F49"; then
            echo "::error::[P3] 请求日志中间件未把客户端中断降级到 Debug"
            exit 1
          fi
          if grep -q "LogWarning" "$F49"; then
            echo "::error::[P3] 请求日志中间件仍存在告警级别日志（客户端主动中断会污染错误监控）"
            exit 1
          fi
          echo "  已确认客户端主动中断不再记告警"

          # [P3] DnsClient 降噪：FallbackDns TCP53 被网络过滤的噪声降到 Error
          F50="src/FastGithub/appsettings.json"
          if [ ! -f "$F50" ]; then
            echo "::error::[2n] 补丁未生效：$F50 不存在"
            exit 1
          fi
          if ! grep -q "FastGithub.DomainResolve.DnsClient" "$F50"; then
            echo "::error::[P3] appsettings.json 未把 DnsClient context 降到 Error"
            exit 1
          fi
          echo "  已确认 DnsClient 日志已降噪"

          # [P3] 服务白名单规范化：判定前必须 Path.GetFullPath
          F51="src/FastGithub.DomainResolve/ServiceInstallUtil.cs"
          if [ ! -f "$F51" ]; then
            echo "::error::[2aa] 补丁未生效：$F51 不存在"
            exit 1
          fi
          if ! grep -q "Path.GetFullPath(binaryPath)" "$F51"; then
            echo "::error::[P3] ServiceInstallUtil 未在判定前规范化镜像路径（.. 可绕过白名单）"
            exit 1
          fi
          # 注意：仅 grep "Path.GetFullPath(binaryPath)" 无判别力——上游 CreateService 调用点本就含该子串。
          # 必须再断言「判定前确实做了 GetDirectoryName(GetFullPath(...)) 规范化」，否则闸门恒真。
          if ! grep -q "Path.GetDirectoryName(Path.GetFullPath(binaryPath))" "$F51"; then
            echo "::error::[P3] ServiceInstallUtil 白名单判定前未对 binaryPath 规范化（.. 可绕过白名单）"
            exit 1
          fi
          echo "  已确认服务镜像路径判定前已规范化"

          # [P3] 背景图路径校验复用：Reset 与 Load 共用 ResolveBackgroundPath
          F52="src/FastGithub.UI/AcceleratorPanel.xaml.cs"
          if [ ! -f "$F52" ]; then
            echo "::error::[2c] 补丁未生效：$F52 不存在"
            exit 1
          fi
          if ! grep -q "ResolveBackgroundPath" "$F52"; then
            echo "::error::[P3] 背景图路径校验方法 ResolveBackgroundPath 缺失"
            exit 1
          fi
          if ! grep -q "ResolveBackgroundPath(File.ReadAllText(BackgroundCfg)" "$F52"; then
            echo "::error::[P3] 恢复默认背景未复用路径校验（可删除任意文件）"
            exit 1
          fi
          echo "  已确认背景图路径校验已复用（Reset 与 Load 同源）"

          # [P3] 面板 Loaded 幂等：只初始化一次
          F53="src/FastGithub.UI/AcceleratorPanel.xaml.cs"
          if [ ! -f "$F53" ]; then
            echo "::error::[2c] 补丁未生效：$F53 不存在"
            exit 1
          fi
          if ! grep -q "initialized" "$F53"; then
            echo "::error::[P3] 加速面板未做 Loaded 幂等（每次切页都会覆写 HF 配置）"
            exit 1
          fi
          echo "  已确认加速面板 Loaded 已幂等"

          # [P3] UI 引擎句柄兜底：并发下 HasExited 抛异常时安全返回
          F54="src/FastGithub.UI/Program.cs"
          if [ ! -f "$F54" ]; then
            echo "::error::[2c] 补丁未生效：$F54 不存在"
            exit 1
          fi
          if ! grep -q "catch (InvalidOperationException)" "$F54"; then
            echo "::error::[P3] UI 引擎句柄读取未捕获 InvalidOperationException（并发下会崩溃）"
            exit 1
          fi
          echo "  已确认 UI 引擎句柄读取已加并发兜底"

          # [P0] 出站 TLS 链校验：链错误必须最先拒绝。
          # 判别串 RemoteCertificateChainErrors 在上游 HttpClientHandler.cs 中**不存在**
          # （上游只出现 RemoteCertificateNameMismatch 与 None），故本断言对上游会失败。
          F55="src/FastGithub.Http/HttpClientHandler.cs"
          if [ ! -f "$F55" ]; then
            echo "::error::[2af] 补丁未生效：$F55 不存在"
            exit 1
          fi
          if ! grep -q "RemoteCertificateChainErrors" "$F55"; then
            echo "::error::[2af] 出站 TLS 未做链错误优先拒绝（TlsIgnoreNameMismatch 域名可被自签证书 MITM）"
            exit 1
          fi
          echo "  已确认出站 TLS 链错误优先拒绝（自签证书不再被放行）"

          # [P2] ssh/git 反向代理 Socket 句柄：成功分支必须 ownsSocket: true。
          # 判据用完整的一行 return 语句而非单词，避免被注释里的说明文字命中。
          F56="src/FastGithub.HttpServer/TcpMiddlewares/TcpReverseProxyHandler.cs"
          if [ ! -f "$F56" ]; then
            echo "::error::[2ag] 补丁未生效：$F56 不存在"
            exit 1
          fi
          if ! grep -q "return new NetworkStream(socket, ownsSocket: true);" "$F56"; then
            echo "::error::[2ag] ssh/git 反向代理仍在泄漏 Socket 句柄（成功分支未设 ownsSocket: true）"
            exit 1
          fi
          echo "  已确认 ssh/git 反向代理不再泄漏 Socket 句柄"

          # [P3] 补齐此前完全无看守的两项：WinDivert64.sys 哈希基线，
          # 以及两个只有 copy /Y 注入、没有任何内容断言的 UI 文件。
          F57="src/FastGithub/Program.cs"
          if [ ! -f "$F57" ]; then
            echo "::error::[2s] 补丁未生效：$F57 不存在"
            exit 1
          fi
          if ! grep -q "8DA085332782708D8767BCACE5327A6EC7283C17CFB85E40B03CD2323A90DDC2" "$F57"; then
            echo "::error::[2s] 补丁未生效：缺少 WinDivert64.sys 的 SHA256 基线（此前完全无断言看守）"
            exit 1
          fi
          echo "  已确认 WinDivert64.sys 已加入哈希自愈基线"

          for f in "src/FastGithub.UI/MainWindow.xaml" "src/FastGithub.UI/AcceleratorPanel.xaml" "src/FastGithub.UI/AcceleratorPanel.xaml.cs"; do
            if [ ! -f "$f" ]; then
              echo "::error::[2c] 补丁未生效：$f 不存在（该文件此前无任何断言看守）"
              exit 1
            fi
          done
          if ! grep -q "AcceleratorPanel" "src/FastGithub.UI/MainWindow.xaml"; then
            echo "::error::[2c] 主窗体未引用加速面板（MainWindow.xaml 缺少 AcceleratorPanel）"
            exit 1
          fi
          echo "  已确认加速面板相关文件存在且已被主窗体引用"

          # [2ah] dnscrypt-proxy 优雅停机 + 断网看护 + 注销/关机钩子。
          # 这一组断言的意义：优雅停机是 hosts 还原 / 代理绕过表清理的前置条件，
          # 补丁没生效就等于把「注销即残留」重新放回主干，必须硬失败。
          F58="src/FastGithub.DomainResolve/DnscryptProxy.cs"
          if [ ! -f "$F58" ]; then
            echo "::error::[2ah] 补丁未生效：$F58 不存在"
            exit 1
          fi
          if ! grep -q "StopService" "$F58"; then
            echo "::error::[2ah] 补丁未生效：服务模式未按优雅顺序停机（未调用 StopService 等待 SERVICE_STOPPED）"
            exit 1
          fi
          if ! grep -q "ReleaseJob" "$F58"; then
            echo "::error::[2ah] 补丁未生效：未释放 Job Object 句柄（停机兜底与句柄泄漏修复缺失）"
            exit 1
          fi
          if ! grep -q "IsPortBindable" "$F58"; then
            echo "::error::[2ah] 补丁未生效：停机后重启仍会用启动期端口快照，可能绑到已被占用的端口"
            exit 1
          fi
          if ! grep -q "CREATE_NEW_PROCESS_GROUP" "$F58"; then
            echo "::error::[2ah] 补丁未生效：dnscrypt-proxy 未按进程组启动，CTRL_BREAK 软停机信号无法定向送达"
            exit 1
          fi
          if ! grep -q "ReferenceEquals" "$F58"; then
            echo "::error::[2ah] 补丁未生效：Exited 回调缺少实例守卫，旧进程迟到事件会清掉新端点"
            exit 1
          fi
          echo "  已确认 dnscrypt-proxy 优雅停机补丁生效"

          F59="src/FastGithub.DomainResolve/NetworkWatchService.cs"
          if [ ! -f "$F59" ]; then
            echo "::error::[2ah] 补丁未生效：$F59 不存在（断网看护缺失）"
            exit 1
          fi
          if ! grep -q "OfflineConfirmThreshold" "$F59"; then
            echo "::error::[2ah] 断网看护缺少抖动抑制阈值，会引发停机/重启风暴"
            exit 1
          fi
          if ! grep -q "ClearCaches" "$F59"; then
            echo "::error::[2ah] 网络恢复后未清 DNS 失败缓存，最长 10 分钟空解析"
            exit 1
          fi
          F59B="src/FastGithub.DomainResolve/DnsClient.cs"
          if [ ! -f "$F59B" ]; then
            echo "::error::[2ah] 补丁未生效：$F59B 不存在（ClearCaches 缺失）"
            exit 1
          fi
          if ! grep -q "public void ClearCaches" "$F59B"; then
            echo "::error::[2ah] DnsClient.ClearCaches 缺失，断网期失败缓存无法清空"
            exit 1
          fi
          F60="src/FastGithub/DnscryptShutdownWatcher.cs"
          if [ ! -f "$F60" ]; then
            echo "::error::[2ah] 补丁未生效：$F60 不存在（注销/关机时无优雅停机钩子）"
            exit 1
          fi
          if ! grep -q "SetConsoleCtrlHandler" "$F60"; then
            echo "::error::[2ah] 注销/关机钩子未注册控制台事件处理器"
            exit 1
          fi
          if ! grep -q "CTRL_LOGOFF_EVENT" "$F60"; then
            echo "::error::[2ah] 注销/关机钩子未覆盖 CTRL_LOGOFF_EVENT"
            exit 1
          fi
          F61="src/FastGithub.UI/Program.cs"
          if [ ! -f "$F61" ]; then
            echo "::error::[2ah] 补丁未生效：$F61 不存在"
            exit 1
          fi
          if ! grep -q "app.SessionEnding" "$F61"; then
            echo "::error::[2ah] UI 未接 SessionEnding，注销时引擎只能被系统强杀"
            exit 1
          fi
          if ! grep -q "NotifySessionEnding" "$F61"; then
            echo "::error::[2ah] UI 的 SessionEnding 未转发到引擎优雅停机路径"
            exit 1
          fi
          F62="src/FastGithub/Startup.cs"
          if [ ! -f "$F62" ]; then
            echo "::error::[2ah] 补丁未生效：$F62 不存在"
            exit 1
          fi
          if ! grep -q "AddDnscryptLifecycle" "$F62"; then
            echo "::error::[2ah] 优雅停机与网络看护未注册到 DI（AddDnscryptLifecycle 缺失）"
            exit 1
          fi
          if ! grep -q '"DnscryptLifecycle"' "src/FastGithub/appsettings.json"; then
            echo "::error::[2ah] appsettings.json 缺少 DnscryptLifecycle 配置节（停机预算与看护阈值无处可配）"
            exit 1
          fi
          if ! grep -q "DnscryptLifecycleOptions.Bind" "src/FastGithub.DomainResolve/NetworkWatchService.cs"; then
            echo "::error::[2ah] 生命周期配置未走手动绑定（ConfigurationBinder 反射路径在 PublishTrimmed 下会静默丢值）"
            exit 1
          fi
          if ! grep -q '启动失败：{ex.Message}' "src/FastGithub.DomainResolve/DnscryptProxy.cs"; then
            echo "::error::[2ah] dnscrypt 启动异常未就地降级，异常上抛会终结测速循环（v3.1.0 回归）"
            exit 1
          fi
          echo "  已确认 断网看护 / 注销关机钩子 / DI 注册 / 启动失败降级 / 裁剪兜底 全部生效"

          # [PATCH] 防 cmd 重定向污染：echo 行里的裸 -> 会被 cmd.exe 当成输出重定向符，
          # 把 echo 后半段写进以 "1.1.2；..." 之类 token 为名的文件（v3.1.0 曾误提交 4 个）。
          if grep -nE '^[[:space:]]*echo[[:space:]].*->' build-portable.cmd; then
            echo "::error::build-portable.cmd 的 echo 行含裸 ->，cmd 会把它当重定向符生成垃圾文件"
            exit 1
          fi
          for junk in "1.1.2；GHSA-jrjw-qgr2-wfcg" "10.0.12；GHSA-qj66-m88j-hmgj" "15s）" "net10.0"; do
            if [ -e "$junk" ]; then
              echo "::error::仓库根目录残留 cmd 重定向生成的垃圾文件：$junk"
              exit 1
            fi
          done
          echo "  已确认构建脚本无 echo 重定向隐患、根目录无历史垃圾文件"

          # [PATCH] v3.1.1 全局逐行审查收尾：锁住下游修复，防止回退
          if ! grep -q "UseShutdownTimeout(TimeSpan.FromSeconds(6d))" "src/FastGithub/Startup.cs"; then
            echo "::error::[2ah] Host 关闭超时未放宽到 6s，会与 StopBudgetMs(2500/4000) 冲突，停机链拿到已取消 token"
            exit 1
          fi
          if grep -q "UseShutdownTimeout(TimeSpan.FromSeconds(1d))" "src/FastGithub/Startup.cs"; then
            echo "::error::[2ah] Host 关闭超时仍是上游 1s（G-2 回退）"
            exit 1
          fi
          if ! grep -q "HostsPatchedSegments" clean.cmd; then
            echo "::error::clean.cmd 未保护 hosts 回滚记录，强杀后卸载将永久丢失自愈依据（G-1 回退）"
            exit 1
          fi
          if ! grep -q "FastGithubProxyOverrideOwned" clean.cmd; then
            echo "::error::clean.cmd 未利用自有记录清理 ProxyOverride（G-3 回退）"
            exit 1
          fi
          if grep -qF "StartsWith('#')" build-portable.cmd; then
            echo "::error::[5i] relays 段终止条件又把注释行当段尾，换模板会残留 relays 键（G-6 回退）"
            exit 1
          fi
          F_G7="src/FastGithub.DomainResolve/ProcessGracefulStop.cs"
          if [ ! -f "$F_G7" ]; then
            echo "::error::[G-7] 补丁目标文件不存在：$F_G7（漏拷时 grep 返回 2 会被误判为「没找到」）"
            exit 1
          fi
          if ! grep -q "GetLastPInvokeError" "$F_G7"; then
            echo "::error::Unix SIGTERM 错误码未用 GetLastPInvokeError 读取 libc errno（G-7 回退）"
            exit 1
          fi
          # [N-1] clean.cmd 卸载自愈悖论防回归（v3.1.1 引入，v3.1.2 随 Release 发布）
          # [R-3] 判真实逻辑字面量，不判注释/提示文案：删掉逻辑只留注释原先也能通过。
          if ! grep -qF 'Get-CimInstance Win32_Process' clean.cmd; then
            echo "::error::clean.cmd 未精确结束锚点，强杀绕过优雅停机链会让 hosts 回滚记录陷入保留死循环（N-1 回退）"
            exit 1
          fi
          if ! grep -qF 'if ([string]::IsNullOrEmpty($rec))' clean.cmd; then
            echo "::error::clean.cmd [3b/7] 保留分支的「无未消费记录才删键」逻辑缺失（N-1 回退）"
            exit 1
          fi
          # [L-1/L-2] v3.1.2 播报诚实度防回归，全部用 ASCII grep 模式规避中文 locale 差异
          GIT_PROBE_COUNT="$(grep -c 'where git' clean.cmd || true)"
          if [ "$GIT_PROBE_COUNT" -lt 2 ]; then
            echo "::error::clean.cmd 未完整探测 git 存在性（[2/7] 与末尾各一处），git 缺失时会误报「已清理」（L-2 回退）"
            exit 1
          fi
          WINDIVERT_QUERY_COUNT="$(grep -c 'sc query WinDivert' clean.cmd || true)"
          if [ "$WINDIVERT_QUERY_COUNT" -lt 2 ]; then
            echo "::error::clean.cmd 未在删除 WinDivert 驱动副本前先停服务，.sys 被占用后仍误报已删除（L-1 回退）"
            exit 1
          fi
          echo "  已确认 v3.1.1 收尾项、N-1 卸载修补与 v3.1.2 播报诚实度修补全部生效"

          if [ ! -d dist ]; then
            echo "::error::dist 目录不存在，构建产物缺失"
            exit 1
          fi
          if find dist -name "*.key" -print -quit | grep -q .; then
            echo "::error::发布包中检出私钥文件（*.key），构建终止"
            exit 1
          fi
          echo "  已确认发布包中无私钥文件（*.key）"

          if [ -d dist/fastgithub_win-x64/cacert ]; then
            echo "::error::发布包中检出预置 cacert 目录，构建终止"
            exit 1
          fi
          echo "  已确认发布包中无预置 CA 目录"

          F45="dist/fastgithub_win-x64"
          if [ ! -d "$F45" ]; then
            echo "::error::[P1] 发布目录不存在：$F45"
            exit 1
          fi
          if [ -n "$(find "$F45" -name '*.pdb' -print -quit)" ]; then
            echo "::error::[P1] 发布包中检出调试符号文件（*.pdb），Release 条件未生效"
            exit 1
          fi
          echo "  已确认发布包中无调试符号文件（*.pdb）"

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FastGithub-Portable-win-x64
          path: dist/FastGithub-Portable-win-x64.zip
          if-no-files-found: error
          retention-days: 7

      # 只有推送 v* tag 才发版。原先每次 push main（包括纯文档提交）都会自动建 Release，
      # 公开仓库里堆出一串同质版本，用户无法分辨哪个才是可信版本。
      - name: Publish Release (仅 tag 触发)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          TITLE="GitHub+HuggingFace 加速工具 ${TAG}"

          # 产物 SHA256 写进 Release notes，用户下载后可自行校验
          SHA256="$(cat dist/SHA256.txt 2>/dev/null || echo '(未生成)')"
          # v3.1.2 起 Release notes 写详细记录：版本变更 + 真机证据 + 未覆盖边界 + 校验值。
          NOTES="Windows 免安装包（自动构建），产物由本 tag 对应的源码直接构建。

          ## v3.1.3 变更（相对已发布的 v3.1.2；0007 最终收口 + R2/R3 竞态根因修复）
          - S-1 粘性停止意图：stopRequested 原在 StopCoreEntryAsync.finally 无条件清回 false，Stop 排队在 ResumeAsync 持锁启动后会被抹掉；改为只由显式 StartAsync 解除，SuspendAsync（pause=true）不置位。
          - S-2 崩溃复活：Exited 回调原只清 LocalEndPoint，强杀/崩溃后状态仍 Running、解析静默退回 FallbackDns；现四重守卫（ReferenceEquals + !stopRequested + State==Running）下落 PausedByNetwork，复用已真机验证的看护恢复链，不在事件回调里起异步；复活失败落 Stopped，最多一次，无风暴。
          - S-2b Start 收尾复查（R2/R3 沙箱实测竞态根因修复）：TransitionAsync 的 Start 分支在 StartCoreAsync 完成后、SetState(Running) 前补 if(stopRequested){回滚 Job/Process/端点; SetState(Stopped); return}。0007 原补丁只改清位时机（S-1），漏了这环；沙箱 R2（T2：20/20 Stop 方向孤儿）与 R3（A4：20/20 Suspend 方向同源）实测指出，一处修复同时覆盖两个方向（R3 结论，T2b 实证孤儿归零）。
          - S-3 看护自恢复：单轮异常原会终结 while 并 Dispose probeSignal，网络恢复永久失效；改为循环内隔离、清零计数、2s 后继续下一轮。
          - 0006a hosts.tmp 占用冲突（真机 02:06 复现）：临时文件名带 Guid、IOException 3×120ms 退避、SemaphoreSlim 串行化、finally 清残留。
          - 0006b 空闲退化四项：连接池 idle 1min→10min；空解析保留上次成功 IP（stale-while-error，开关 PRESERVE_LAST_KNOWN_GOOD_IPS 可回退）；失败耗时 5min→30s/1min；恢复只清失败项 ClearFailureCaches()。
          - 脚本/配置零风险项：F-1 行内 // 注释剥离（主配置 ConvertFrom-Json 原 100% 静默失败）、F-2 比较时 Trim、F-3 [2f] 替换命中强断言、H-1 [5j] 国内 bootstrap 优先 + netprobe_timeout 60→10、H-2 CI 闸门 -f 前置、R-2 CIM 返回值校验、R-3 断言改判真实逻辑字面量、D-3 负缓存 5s 文案订正、ProxyOverride 改 List 保序写回（HashSet 会逐次翻转）、ClearDnsCacheWhenOffline 接上读取点（默认 false 行为不变）。
          - CI：新增 16 条防回归断言（0007 的 15 条 + S-2b Start 收尾复查 1 条），R-3 两条 N-1 断言改判真实逻辑字面量；产品版本号升到 3.1.3，引擎横幅与 UI 标题同源。

          ## 真机证据（0007 收口 + G-2 销账 + 沙箱三报告）
          - G-2 复验（已销账，2026-11-21 01:12/01:24/01:25）：关控制台窗口走 CTRL_CLOSE 钩子 22ms 完整链；Ctrl+C 走 ConsoleLifetime→host.StopAsync() 只留已优雅退出（5ms）；注销无停机日志但三个 exe 全无孤儿。-Check 只读核验 ProxyOverride 精确回到 20 条用户条目、FastGithubProxyOverrideOwned 已删、5533 无监听。
          - 卸载日志（N-1 修复后 clean.cmd）：[0/7] 只结束 1 锚点 + UI、无 /F 强杀 → 8s 窗口引擎自行优雅停机；[3b/7] 无未消费 HostsPatchedSegments；[1/7] 移除 2 CA、[4/7] 删 cacert（含私钥）、[7/7] 删 WinDivert 服务。
          - 反复启停 20 轮句柄 1040→948（斜率 -4.84/轮，无泄漏）；断网→暂停 4.5s、恢复→可用约 5s；延迟 direct P50 0.006~0.012s / accel P50 0.019~0.021s，加速态 P95 长尾从 0.141~0.146s 削到 0.028~0.042s。
          - 沙箱实测（R1/R2/R3 三份报告）：R2 T2 发现 Start 收尾复查缺口（20/20 孤儿）、T2b 实证修复有效；R3 A4 确认 pause 方向同源（20/20）、A5 1000 次抖动状态机自洽；端口实探双绑口径/退避/反复启停 10/10 无幽灵端口；配置边界 37/37、匹配边界 23/23 全过。

          ## 已知未覆盖（不阻塞本次发布，均为极端工况/OS 限制）
          - S-4 注销不经 UI 的优雅停机：交互式会话收不到 CTRL_LOGOFF，进程随即被终止；真机确认无孤儿但不走还原链。
          - R-1 服务模式 + hosts 残留 + 强杀后卸载的三重叠加；AppHostedService 同步 WaitForExit() 的服务模式停机竞态（G-2 三种停法真机全过）。
          - H-3 packages.lock.json（需 dotnet restore --locked-mode 生成）、H-4 ReferenceAssemblies.net45（需 CI runner 确认 targeting pack）、F-4 Set-Content BOM 不一致（信息级，对 MSBuild/Roslyn 无害）。

          ## 使用与卸载
          - 解压后以管理员身份运行 FastGithub.UI.exe，首次运行信任本地 CA。
          - 卸载：以管理员身份运行包内 clean.cmd（移除 CA、恢复 git 配置、删除私钥与驱动副本）。
          - 不要分发运行过的程序目录：cacert/fastgithub.key 是本机生成的明文 CA 私钥。
          - 源码与验收记录：https://github.com/Rickeal-Boss/GitHubplus/tree/fix

          校验：FastGithub-Portable-win-x64.zip 的 SHA256 = ${SHA256}"

          # 幂等：重推同一 tag 重跑时不因 release 已存在而失败（不加 --cleanup-tag，避免删掉触发本次构建的 tag）
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "  已存在 release ${TAG}，先删除再重建"
            gh release delete "${TAG}" -y
          fi
          gh release create "${TAG}" \
            dist/FastGithub-Portable-win-x64.zip \
            --title "${TITLE}" \
            --notes "${NOTES}"
