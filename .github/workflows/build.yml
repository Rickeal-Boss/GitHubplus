name: Build Windows Portable

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

# 创建 Release 需要写权限；构件上传沿用默认 token 即可
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 7 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'

      - name: Build portable package
        shell: cmd
        run: build-portable.cmd

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FastGithub-Portable-win-x64
          path: dist/FastGithub-Portable-win-x64.zip
          if-no-files-found: error

      - name: Publish Release (每次构建成功同步发版)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
            TITLE="GitHub+HuggingFace 加速工具 ${TAG}"
          else
            TAG="ci-${GITHUB_RUN_NUMBER}"
            TITLE="GitHub+HuggingFace 加速工具（自动构建 #${GITHUB_RUN_NUMBER}）"
          fi
          gh release create "${TAG}" \
            dist/FastGithub-Portable-win-x64.zip \
            --title "${TITLE}" \
            --notes "Windows 免安装包（自动构建）。解压后以管理员身份运行 FastGithub.UI.exe，首次运行信任本地 CA；托盘右键“检测更新”跳转本仓库。"
